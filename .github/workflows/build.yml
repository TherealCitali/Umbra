name: Build Windows Browser

# Build a downloadable Windows .exe artifact on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci || npm install

      # --no-bundle builds only the portable .exe (fast). Remove it later
      # if you also want an NSIS installer in the same artifact.
      - name: Build portable executable
        run: npm run tauri -- build --no-bundle

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-windows-exe
          path: src-tauri/target/release/umbra.exe
          if-no-files-found: error
          retention-days: 30

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Tab</title>
<style>
  :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1000px 600px at 50% -10%,#2f6fed33,transparent),Canvas}
  main{text-align:center;padding:24px;max-width:640px}
  h1{font-size:42px;margin:0 0 8px;letter-spacing:-.03em}
  p{opacity:.7;margin:0 0 24px}
  form{display:flex;gap:8px}
  input{flex:1;padding:14px 16px;border-radius:999px;border:1px solid #8886;font-size:16px;background:Canvas}
  button{padding:14px 20px;border:0;border-radius:999px;background:#2f6fed;color:#fff;font-size:16px;cursor:pointer}
  .links{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .links a{padding:8px 12px;border:1px solid #8885;border-radius:999px;color:inherit;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="/umbra-icon.png" alt="Umbra" width="84" height="84" style="border-radius:50%" />
  <h1>Umbra</h1>
  <p>Lightweight, fast, private by default. Search or visit a site.</p>
  <form id="f"><input id="q" placeholder="Search the web…" autofocus /><button>Search</button></form>
  <div class="links">
    <a href="https://duckduckgo.com">DuckDuckGo</a><a href="https://www.wikipedia.org">Wikipedia</a>
    <a href="https://github.com">GitHub</a><a href="https://news.ycombinator.com">Hacker News</a>
  </div>
</main>
<script>
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('q').value.trim();
    if (!v) return;
    const isUrl = !v.includes(' ') && v.includes('.');
    location.href = isUrl ? (v.startsWith('http') ? v : 'https://' + v) : 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
  });
</script>
</body>
</html>
